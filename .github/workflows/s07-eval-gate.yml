# Eval gate: on every pull request that can change the agent's behaviour, run the regression dataset on the
# prompt version pinned in the branch and compare each case with evals/approved-baseline.json.
# A case that passed in the baseline and fails now fails this check; make it a required status check of main.
# https://langfuse.com/docs/evaluation/experiments/experiments-ci-cd
name: eval-gate (session 07)
on:
  pull_request:
    paths: ["sessions/07_continuous_eval/**"]

permissions:
  contents: read
  pull-requests: write  # the action posts the results as a PR comment
  actions: read

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sessions/07_continuous_eval  # in your own repository the session folder is the root
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.3  # this action publishes no major tag (v10): pin a release
        with:
          version: "0.13.1"
      - name: Install the locked environment
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"  # the action's python is the project's environment
      # Pinned to the commit of release v1.0.13, as the action's README recommends.
      - uses: langfuse/experiment-action@0a6ce59e6ebb0c21ec4d35c372b819ce8f65eaea # v1.0.13
        env:  # read by the app's Settings inside the experiment
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
        with:
          langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse_base_url: ${{ vars.LANGFUSE_BASE_URL }}
          experiment_path: sessions/07_continuous_eval/evals/gate.py
          dataset_name: research-assistant-regression
          should_skip_sdk_installation: "true"  # langfuse comes from uv.lock, same version as the app
          github_token: ${{ github.token }}
